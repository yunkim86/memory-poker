<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>데블스 플랜: 기억 포커</title>
<meta name="apple-mobile-web-app-title" content="기억 포커">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#170a0d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: tense game-show table, late night, two rivals over one tablet.
   IDEA: a casino felt table split down the middle, a tug-of-war rope for the 20-point gap.
   PICTURE: the two card boards themselves, red-backed cards that flip.
   COLOUR and TYPE: oxblood felt, ivory cards, devil red; teal vs apricot players; Black Han Sans + Noto Sans KR.
   LAYOUT: score bar + two self-contained player panels (side by side, or facing with one rotated). */
:root{color-scheme:dark;--bg:#170a0d;--panel:#24100f;--felt:#2d1215;--line:rgba(255,235,220,.12);--line2:rgba(255,235,220,.28);--ink:#f6ede4;--mute:#bba49f;--red:#e03a3e;--gold:#f0c35a;--p1:#4fc1b0;--p2:#f2a160}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Noto Sans KR",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#app{height:100vh;height:100dvh;display:grid;gap:8px;padding:8px}
#app.side{grid-template:"bar bar" auto "p0 p1" minmax(0,1fr)/minmax(0,1fr) minmax(0,1fr)}
#app.face{grid-template:"p1" minmax(0,1fr) "bar" auto "p0" minmax(0,1fr)/minmax(0,1fr)}
#bar{grid-area:bar;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.rd{display:flex;flex-direction:column;line-height:1.1}.rd b{font:22px "Black Han Sans",sans-serif;letter-spacing:.5px}.rd span{font-size:13px;color:var(--mute)}
.tug{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.tsc{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.tsc b{font:30px "Black Han Sans",sans-serif}.tsc span{font-size:14px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.tsc.a b{color:var(--p1)}.tsc.b b{color:var(--p2)}
.track{position:relative;height:30px}
.track::before{content:"";position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--line)}
.track::after{content:"";position:absolute;left:50%;top:6px;width:2px;height:18px;background:var(--line2);margin-left:-1px}
.fill{position:absolute;top:13px;height:4px;border-radius:2px;transition:all .6s cubic-bezier(.3,1.4,.5,1)}
.knob{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--panel),0 2px 8px #000;transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.end{position:absolute;top:0;width:10px;height:30px;border-radius:3px;opacity:.85}.end.l{left:-2px;background:var(--p1)}.end.r{right:-2px;background:var(--p2)}
.gap{position:absolute;left:0;right:0;top:-4px;text-align:center;font-size:12px;color:var(--mute);pointer-events:none}
.ctl{display:flex;gap:8px;align-items:center}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--pc,var(--red));color:#1b0b0f;font-weight:800;font-size:17px;cursor:pointer;white-space:nowrap}
#act{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hide{display:none!important}
.panel{position:relative;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(120% 80% at 50% 40%,#3a171b,var(--felt) 60%,#1f0c0f);overflow:hidden}
.panel[data-p="0"]{grid-area:p0;--pc:var(--p1)}.panel[data-p="1"]{grid-area:p1;--pc:var(--p2)}
#app.face .panel[data-p="1"]{transform:rotate(180deg)}
.panel.done{box-shadow:inset 0 0 0 2px var(--pc)}
.ph{display:flex;align-items:center;gap:10px;min-height:32px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.nm{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font:24px "Black Han Sans",sans-serif;color:var(--pc)}
.st{margin-left:auto;font-weight:600;font-size:16px;color:var(--mute);white-space:nowrap}
.st.hot{color:var(--ink)}
.tm{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.tm i{display:block;height:100%;width:0;background:var(--pc);transition:width .1s linear}
.sh{display:flex;align-items:center;justify-content:center;gap:12px}
.sh .lb{font-size:13px;color:var(--mute);writing-mode:vertical-rl;letter-spacing:2px}
.shc{display:flex;gap:8px;--cw:var(--sw,56px)}
.bw{flex:1;position:relative;display:grid;place-items:center;min-height:0}
.bd{display:grid;gap:var(--g,10px);grid-template-columns:repeat(var(--n,3),var(--cw,80px))}
.card{width:var(--cw);aspect-ratio:5/7;position:relative;border:0;padding:0;background:none;cursor:pointer;font-size:calc(var(--cw)*.28);perspective:900px;border-radius:calc(var(--cw)*.09);transition:transform .2s,filter .3s}
.in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;border-radius:calc(var(--cw)*.09);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.back{background:repeating-linear-gradient(45deg,rgba(255,240,225,.08) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(255,240,225,.08) 0 2px,transparent 2px 9px),linear-gradient(160deg,#ad2232,#6a1220);box-shadow:inset 0 0 0 calc(var(--cw)*.05) #f3e6d6,inset 0 0 0 calc(var(--cw)*.07) #6a1220,0 3px 8px rgba(0,0,0,.5)}
.back::after{content:"";position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;border:2px solid rgba(243,230,214,.6);transform:translate(-50%,-50%) rotate(45deg);border-radius:3px}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#fffcf6,#f1e9dc);color:#1d1a1a}
.front.red{color:#c8202f}
.r{position:absolute;left:8%;top:5%;display:flex;flex-direction:column;align-items:center;font:800 1em/.95 Georgia,"Times New Roman",serif}.r small{font-size:.72em;margin-top:2px}
.big{position:absolute;inset:0;display:grid;place-items:center;padding-top:14%;font-size:1.75em;line-height:1}
.bdg,.star{position:absolute;display:none;place-items:center;border-radius:50%;font-weight:800;z-index:2}
.bdg{top:-9px;right:-9px;width:26px;height:26px;background:var(--pc);color:#1b0b0f;font-size:14px}
.star{bottom:-9px;left:-9px;width:26px;height:26px;background:#1b0b0f;color:var(--gold);font-size:16px;border:1.5px solid var(--gold)}
.card.pk{transform:translateY(-4px);outline:3px solid var(--pc);outline-offset:3px}.card.pk .bdg{display:grid}
.card.best .star{display:grid}
.card.dim{filter:saturate(.35) brightness(.5)}
.msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;font:clamp(44px,11vmin,120px)/1 "Black Han Sans",sans-serif;text-shadow:0 4px 24px #000,0 0 2px #000;opacity:0;transition:opacity .2s}
.msg.on{opacity:1}.msg.sm{font-size:clamp(26px,5.5vmin,52px)}.msg small{display:block;font:600 .38em "Noto Sans KR",sans-serif;color:var(--mute);margin-top:.5em}
.pf{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:50px}
.hd{display:flex;flex-direction:column;line-height:1.2}.hd b{font:22px "Black Han Sans",sans-serif}.hd b em{font-style:normal;color:var(--pc);margin-left:8px}.hd small{color:var(--mute);font-size:13px}
.res{font:20px "Black Han Sans",sans-serif;padding:2px 10px;border-radius:8px;background:var(--line)}.res.w{background:var(--pc);color:#1b0b0f}
.btns{display:flex;gap:8px;margin-left:auto}
.ov{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:16px;background:rgba(14,5,8,.88);overflow:auto}
.ov.on{display:grid}
.sheet{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,36px);box-shadow:0 20px 60px #000}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px}
h1{font:clamp(40px,6vw,60px)/1.05 "Black Han Sans",sans-serif;margin:0 0 6px;color:var(--ink)}h1 span{color:var(--red)}
h2{font:26px/1.1 "Black Han Sans",sans-serif;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
ol{margin:0;padding-left:1.3em}ol li{margin:0 0 8px}ol b{color:var(--gold);font-weight:600}
.fld{display:grid;gap:12px}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr);align-items:center;gap:10px;font-size:15px;color:var(--mute)}
.tri input,.row input[type=text],.row input[type=number]{width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line2);background:#1a0a0d;font-size:16px;color:var(--ink)}
.row input:focus{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden}
.seg label{flex:1;position:relative}.seg input{position:absolute;opacity:0}
.seg span{display:grid;place-items:center;min-height:44px;padding:0 8px;cursor:pointer;color:var(--ink);font-size:15px;text-align:center}
.seg input:checked+span{background:var(--red);color:#fff;font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--gold);outline-offset:-3px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tri label{display:grid;gap:4px;font-size:13px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:28px}
.pts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin-top:10px}
.pts label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.pts input{width:64px;min-height:38px;border-radius:8px;border:1.5px solid var(--line2);background:#1a0a0d;text-align:right;padding:0 8px;font-size:16px}
.go{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.go .btn{flex:1;min-height:56px;font-size:19px}
.win{font:clamp(44px,7vw,72px)/1 "Black Han Sans",sans-serif;margin:4px 0 6px}
.fin{font:28px "Black Han Sans",sans-serif;color:var(--mute);margin-bottom:16px}
.hist{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.mn{display:grid;gap:10px;max-width:400px}.mn .btn{min-height:56px}
.rk{min-height:40px;padding:0 14px;font-size:15px;font-weight:600}
.guide{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;gap:8px;padding:12px 14px;background:rgba(22,8,11,.97);overflow:auto}
.panel.gd .guide{display:flex}
.gh{display:flex;align-items:center;gap:10px}.gh h3{margin:0;font:24px "Black Han Sans",sans-serif;flex:1}
.gl{display:grid;gap:4px}
.gr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:6px 10px;border-radius:10px;background:rgba(255,235,220,.045)}
.gr.me{box-shadow:inset 0 0 0 2px var(--pc);background:rgba(255,235,220,.1)}
.gr b{font-weight:800;font-size:16px}.gr small{display:block;color:var(--mute);font-size:13px;line-height:1.3}
.ex{display:flex;gap:3px}.ex i{font:700 14px/1 Georgia,"Times New Roman",serif;font-style:normal;background:#fbf7ef;color:#1d1a1a;border-radius:4px;padding:4px 4px 3px;white-space:nowrap}.ex i.rd{color:#c8202f}
.gp{font:22px "Black Han Sans",sans-serif;color:var(--pc);min-width:2.6em;text-align:right;white-space:nowrap}
.gn{font-size:13px;color:var(--mute);margin:2px 2px 0}
@media(max-width:860px){#app.side .ex{display:none}}
.mn .note{font-size:14px;color:var(--mute);margin:-4px 0 4px}
#app.paused .bw,#app.paused .shc{filter:blur(18px) brightness(.4)}
#resumeBox{display:flex;gap:10px;flex:1 1 100%;flex-wrap:wrap}#resumeBox .btn{border-color:var(--gold)}
#resume small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}#bar{grid-template-columns:minmax(0,1fr) auto}.rd{display:none}.tsc span{display:none}}
@media(prefers-reduced-motion:reduce){.in,.knob,.fill,.card{transition:none}}
</style>
</head>
<body>
<div id="app" class="side">
  <header id="bar">
    <div class="rd"><b id="rdN"></b><span id="rdS"></span></div>
    <div class="tug">
      <div class="tsc a"><span id="tn0"></span><b id="ts0">0</b></div>
      <div class="track"><span class="end l"></span><span class="end r"></span><span class="fill" id="fill"></span><span class="knob" id="knob"></span><span class="gap" id="gap"></span></div>
      <div class="tsc b"><b id="ts1">0</b><span id="tn1"></span></div>
    </div>
    <div class="ctl"><button class="btn" id="act"></button><button class="btn ghost" id="menuBtn" data-t="menu"></button></div>
  </header>
  <section class="panel" data-p="0">
    <div class="ph"><i class="dot"></i><b class="nm"></b><span class="sc">0</span><span class="st"></span><button type="button" class="btn ghost rk" data-t="rk"></button></div>
    <div class="tm"><i></i></div>
    <div class="sh"><span class="lb" data-t="share"></span><div class="shc"></div></div>
    <div class="bw"><div class="bd"></div><div class="msg"></div></div>
    <div class="pf"><span class="hd"></span><span class="btns"><button class="btn ghost rs" data-t="clear"></button><button class="btn ok"></button></span></div>
    <div class="guide" role="dialog" data-ta="gTitle"></div>
  </section>
  <section class="panel" data-p="1">
    <div class="ph"><i class="dot"></i><b class="nm"></b><span class="sc">0</span><span class="st"></span><button type="button" class="btn ghost rk" data-t="rk"></button></div>
    <div class="tm"><i></i></div>
    <div class="sh"><span class="lb" data-t="share"></span><div class="shc"></div></div>
    <div class="bw"><div class="bd"></div><div class="msg"></div></div>
    <div class="pf"><span class="hd"></span><span class="btns"><button class="btn ghost rs" data-t="clear"></button><button class="btn ok"></button></span></div>
    <div class="guide" role="dialog" data-ta="gTitle"></div>
  </section>
</div>

<div class="ov on" id="start"><form class="sheet" id="setup">
  <div class="cols">
    <div>
      <h1><span style="display:block;font-size:.45em;color:var(--red);margin-bottom:6px" data-t="brand"></span><span data-t="game" style="color:var(--ink)"></span></h1>
      <p class="sub" data-t="sub"></p>
      <ol id="rules"></ol>
    </div>
    <div class="fld">
      <div class="row"><span data-t="lang"></span><div class="seg"><label><input type="radio" name="lang" value="ko"><span>한국어</span></label><label><input type="radio" name="lang" value="en"><span>English</span></label></div></div>
      <div class="row"><span data-t="p1"></span><input type="text" id="n0" maxlength="12"></div>
      <div class="row"><span data-t="p2"></span><input type="text" id="n1" maxlength="12"></div>
      <div class="row"><span data-t="layout"></span><div class="seg"><label><input type="radio" name="layout" value="side"><span data-t="side"></span></label><label><input type="radio" name="layout" value="face"><span data-t="face"></span></label></div></div>
      <div class="row"><span data-t="scoring"></span><div class="seg"><label><input type="radio" name="mode" value="each"><span data-t="each"></span></label><label><input type="radio" name="mode" value="winner"><span data-t="winner"></span></label></div></div>
      <div class="row"><span data-t="target"></span><input type="number" id="target" min="1" max="200"></div>
      <div class="tri">
        <label><span data-t="m3"></span><input type="number" id="m3" min="2" max="120"></label>
        <label><span data-t="m4"></span><input type="number" id="m4" min="2" max="120"></label>
        <label><span data-t="pt"></span><input type="number" id="pt" min="0" max="120"></label>
      </div>
      <details><summary data-t="ptsSum"></summary><div class="pts" id="pts"></div></details>
    </div>
  </div>
  <div class="go"><div id="resumeBox" class="hide"><button class="btn ghost" type="button" id="resume"><span data-t="resume"></span><small id="resumeT"></small></button><button class="btn ghost" type="button" id="delSave" style="flex:0 0 auto" data-t="del"></button></div><button class="btn" type="submit" id="newBtn" style="background:var(--red);color:#fff"></button></div>
</form></div>

<div class="ov" id="over"><div class="sheet">
  <div style="color:var(--mute)" data-t="overH"></div>
  <div class="win" id="winT"></div>
  <div class="fin" id="finT"></div>
  <div class="hist"><table><thead><tr><th data-t="thR"></th><th data-t="thS"></th><th id="h0"></th><th class="n" data-t="thP"></th><th id="h1"></th><th class="n" data-t="thP"></th></tr></thead><tbody id="histB"></tbody></table></div>
  <div class="go"><button class="btn" id="again" style="background:var(--red);color:#fff" data-t="again"></button><button class="btn ghost" id="toSetup" data-t="toSetup"></button></div>
</div></div>

<div class="ov" id="menu"><div class="sheet mn">
  <h2 data-t="pauseH"></h2>
  <p class="note" id="mNote"></p>
  <button class="btn" id="mClose" style="background:var(--red);color:#fff" data-t="cont"></button>
  <button class="btn ghost" id="mSave" data-t="mSave"></button>
  <button class="btn ghost" id="mEnd" data-t="mEnd"></button>
  <button class="btn ghost" id="mLayout" data-t="mLayout"></button>
  <button class="btn ghost" id="mLang" data-t="mLang"></button>
  <button class="btn ghost" id="mFull" data-t="mFull"></button>
  <button class="btn ghost" id="mRestart" data-t="mRestart"></button>
</div></div>

<script>
{
const RN={11:'J',12:'Q',13:'K',14:'A'},SU=['♠','♥','♦','♣'];
const GXC=['A♠ J♥ 8♦ 5♣ 2♠','9♠ 9♥ K♦ 6♣ 2♠','J♠ J♦ 4♥ 4♣ A♠','7♠ 7♥ 7♦ K♣ 2♠','9♠ 8♥ 7♦ 6♣ 5♠','K♥ 10♥ 8♥ 5♥ 3♥','Q♠ Q♥ Q♦ 4♣ 4♠','8♠ 8♥ 8♦ 8♣ A♠','9♥ 8♥ 7♥ 6♥ 5♥','A♠ K♠ Q♠ J♠ 10♠'];
const I18N={
ko:{doc:'데블스 플랜: 기억 포커',brand:'데블스 플랜:',game:'기억 포커',sub:'2인 대전 · 태블릿 한 대로 함께',
 rules:T=>`<li>카드가 잠시 앞면으로 공개됩니다. <b>위치를 외우세요.</b> 1–3라운드는 3×3, 4라운드부터는 4×4.</li><li>카드가 뒤집히면 <b>공유 카드 3장</b>이 열립니다.</li><li>각자 자기 판에서 카드 <b>2장</b>을 눌러 고르고 ‘확정’. 상대와 같은 카드를 골라도 됩니다.</li><li>고른 2장 + 공유 3장 = 내 다섯 장. <b>족보 점수</b>를 가져갑니다. 문양 순위는 없습니다.</li><li>두 사람의 점수 차가 <b>${T}</b>점이 되는 순간 게임 끝.</li>`,

 GX:['No combination · highest card decides','Two cards of the same rank','Two different pairs','Three cards of the same rank','Five ranks in a row (A-2-3-4-5 counts)','Five cards of one suit','Three of a kind + a pair','Four cards of the same rank','Five in a row, all one suit','10-J-Q-K-A, all one suit'],

const DEF={n:['',''],lang:'ko',layout:'side',mode:'each',target:20,m3:10,m4:20,pt:0,pts:[0,1,2,3,5,6,8,12,15,20]};
const $=s=>document.querySelector(s);
const app=$('#app'),P=[0,1].map(p=>$(`.panel[data-p="${p}"]`));
const isDefName=v=>v===I18N.ko.p[0]||v===I18N.ko.p[1]||v===I18N.en.p[0]||v===I18N.en.p[1];
let C=load(),L=I18N[C.lang];
const S={round:0,size:3,scores:[0,0],phase:'idle',grid:[],shared:[],picks:[[],[]],locked:[false,false],hands:null,gain:[0,0],best:null,hist:[],over:false,stopped:false,tm:null,msg:''};

function load(){let o=null;try{o=JSON.parse(localStorage.getItem('memoryPoker2p')||'null')}catch(e){}
  const c={...DEF,...(o||{})};c.pts=(o&&o.pts&&o.pts.length===10)?o.pts:DEF.pts.slice();
  c.n=(c.n||['','']).map(v=>isDefName(v)?'':v);
  if(!o||!o.lang){const h=location.hash.slice(1);c.lang=(h==='en'||h==='ko')?h:((navigator.language||'ko').toLowerCase().startsWith('ko')?'ko':'en')}
  return c}
function save(){try{localStorage.setItem('memoryPoker2p',JSON.stringify(C))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=c=>SU[c.s]+(RN[c.r]||c.r);
const dn=p=>C.n[p]||L.p[p];

function deck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}
function evalHand(cs){
  const rs=cs.map(c=>c.r).sort((a,b)=>b-a),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const gr=Object.entries(cnt).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const fl=cs.every(c=>c.s===cs[0].s),u=[...new Set(rs)];
  let st=0;if(u.length===5){if(u[0]-u[4]===4)st=u[0];else if(u.join()==='14,5,4,3,2')st=5}
  let k;
  if(st&&fl)k=st===14?9:8;else if(gr[0][1]===4)k=7;else if(gr[0][1]===3&&gr[1][1]===2)k=6;else if(fl)k=5;else if(st)k=4;else if(gr[0][1]===3)k=3;else if(gr[0][1]===2&&gr[1][1]===2)k=2;else if(gr[0][1]===2)k=1;else k=0;
  return{k,tb:st?[st]:gr.map(g=>g[0])};
}
function cmp(a,b){if(a.k!==b.k)return a.k-b.k;for(let i=0;i<Math.max(a.tb.length,b.tb.length);i++){const d=(a.tb[i]||0)-(b.tb[i]||0);if(d)return d}return 0}
function bestPair(){let b=null;for(let i=0;i<S.grid.length;i++)for(let j=i+1;j<S.grid.length;j++){const h=evalHand([S.grid[i],S.grid[j],...S.shared]);if(!b||cmp(h,b.h)>0)b={i,j,h}}return b}

const ariaOf=i=>i>=100?L.shared(i-99):L.card(i+1);
function cardHTML(c,i){const red=c.s===1||c.s===2,s=SU[c.s],r=RN[c.r]||c.r;
  return `<button type="button" class="card" data-i="${i}" aria-label="${ariaOf(i)}"><span class="in"><span class="f back"></span><span class="f front${red?' red':''}"><span class="r">${r}<small>${s}</small></span><span class="big">${s}</span></span></span><span class="bdg"></span><span class="star">★</span></button>`}

function build(){
  P.forEach(pn=>{const bd=pn.querySelector('.bd');bd.style.setProperty('--n',S.size);bd.innerHTML=S.grid.map(cardHTML).join('');
    pn.querySelector('.shc').innerHTML=S.shared.map((c,i)=>cardHTML(c,100+i)).join('')});
  fitAll();
}
function fit(p){const pn=P[p],bw=pn.querySelector('.bw'),bd=pn.querySelector('.bd');
  const sw=Math.round(Math.max(34,Math.min(78,pn.clientWidth*.1,pn.clientHeight*.095)));pn.style.setProperty('--sw',sw+'px');
  requestAnimationFrame(()=>{const w=bw.clientWidth-16,h=bw.clientHeight-16,n=S.size,g=Math.round(Math.max(6,Math.min(16,w*.025)));
    const cw=Math.floor(Math.max(30,Math.min((w-g*(n-1))/n,((h-g*(n-1))/n)*5/7)));bd.style.setProperty('--cw',cw+'px');bd.style.setProperty('--g',g+'px')})}
function fitAll(){fit(0);fit(1)}
const ro=new ResizeObserver(fitAll);P.forEach(pn=>ro.observe(pn));

function paint(){
  const ph=S.phase,rev=ph==='reveal';
  app.className=C.layout+(S.paused?' paused':'');
  P.forEach((pn,p)=>{
    const pk=S.picks[p],lk=S.locked[p],showPk=(ph==='pick'&&!lk)||rev;
    pn.querySelector('.nm').textContent=dn(p);pn.querySelector('.sc').textContent=S.scores[p];
    pn.querySelectorAll('.bd .card').forEach(b=>{const i=+b.dataset.i,ix=pk.indexOf(i);
      b.classList.toggle('up',ph==='memo'||rev);
      b.classList.toggle('pk',showPk&&ix>=0);b.querySelector('.bdg').textContent=ix>=0?ix+1:'';
      b.classList.toggle('dim',rev&&ix<0);
      b.classList.toggle('best',rev&&!!S.best&&(i===S.best.i||i===S.best.j))});
    pn.querySelectorAll('.shc .card').forEach(b=>b.classList.toggle('up',ph==='pick'||rev));
    pn.classList.toggle('done',ph==='pick'&&lk);
    const st=pn.querySelector('.st'),msg=pn.querySelector('.msg'),hd=pn.querySelector('.hd'),ok=pn.querySelector('.ok'),rs=pn.querySelector('.rs');
    st.classList.toggle('hot',ph==='memo'||(ph==='pick'&&!lk));
    msg.className='msg';msg.innerHTML='';hd.innerHTML='';ok.classList.add('hide');rs.classList.add('hide');
    if(ph==='idle'){st.textContent=''}
    else if(ph==='ready'){st.textContent=L.ready;msg.className='msg on sm';msg.innerHTML=L.readyMsg(S.round,S.size)}
    else if(ph==='count'){st.textContent=L.soon;msg.className='msg on';msg.textContent=S.msg}
    else if(ph==='memo'){st.textContent=L.memo(S.msg)}
    else if(ph==='pick'){
      if(lk){st.textContent=L.done;msg.className='msg on sm';msg.innerHTML=`${L.done}<small>${S.locked[1-p]?'':L.wait}</small>`;ok.classList.remove('hide');ok.textContent=L.edit;ok.className='btn ghost ok';ok.disabled=false}
      else{st.textContent=L.pick(pk.length,S.msg);ok.classList.remove('hide');ok.className='btn ok';ok.textContent=L.ok;ok.disabled=pk.length<2;rs.classList.remove('hide');rs.disabled=!pk.length}
    }
    else if(rev){const h=S.hands[p],c=cmp(h,S.hands[1-p]);
      st.innerHTML=`<span class="res${c>0?' w':''}">${L.res[Math.sign(c)+1]}</span>`;
      hd.innerHTML=`<b>${L.HN[h.k]}<em>+${S.gain[p]}</em></b><small>${L.best(L.HN[S.best.h.k])}</small>`}
  });
  const d=S.scores[0]-S.scores[1],t=C.target,x=Math.max(-1,Math.min(1,d/t));
  $('#tn0').textContent=dn(0);$('#tn1').textContent=dn(1);$('#ts0').textContent=S.scores[0];$('#ts1').textContent=S.scores[1];
  const pos=50-x*50;$('#knob').style.left=pos+'%';const f=$('#fill');f.style.left=Math.min(pos,50)+'%';f.style.width=Math.abs(pos-50)+'%';f.style.background=d>0?'var(--p1)':'var(--p2)';
  $('#gap').textContent=L.gap(Math.abs(d),t);
  $('#rdN').textContent=S.round?L.round(S.round):L.roundNone;
  $('#rdS').textContent=S.round?`${S.size}×${S.size} · ${ph==='pick'?L.phPick(S.locked.filter(Boolean).length):(L.ph[ph]||'')}`:L.idle;
  const act=$('#act');act.classList.toggle('hide',!(ph==='ready'||rev));act.textContent=ph==='ready'?L.actStart:S.over?L.actRes:L.actNext;
}

function bars(frac){P.forEach(pn=>pn.querySelector('.tm i').style.width=(frac*100)+'%')}
let T=null;
function tickT(){if(!T)return;const left=Math.max(0,(T.end-performance.now())/1000);T.onTick(left);if(left<=0){clearInterval(S.tm);S.tm=null;const f=T.onEnd;T=null;f()}}
function timer(sec,onTick,onEnd){clearInterval(S.tm);T={end:performance.now()+sec*1000,onTick,onEnd};if(S.paused){T.left=sec;return}S.tm=setInterval(tickT,100);tickT()}
function stopTimer(){clearInterval(S.tm);S.tm=null;T=null;S.msg='';bars(0)}
function pause(){if(S.paused)return;S.paused=true;if(T){clearInterval(S.tm);S.tm=null;T.left=Math.max(0,(T.end-performance.now())/1000)}paint()}
function resume(){if(!S.paused)return;S.paused=false;if(T&&T.left!=null){T.end=performance.now()+T.left*1000;T.left=null;S.tm=setInterval(tickT,100)}paint()}

const SK='memoryPoker2pSave';
function getSave(){try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SK)}catch(e){}}
function saveGame(){if(!S.round||S.over){clearSave();return}
  try{localStorage.setItem(SK,JSON.stringify({round:S.round,done:S.phase==='reveal',scores:S.scores,hist:S.hist,at:Date.now()}))}catch(e){}}
function resumeGame(sv){stopTimer();S.paused=false;S.scores=sv.scores;S.hist=sv.hist||[];S.over=false;S.stopped=false;S.round=sv.done?sv.round:sv.round-1;nextRound()}

function startGame(){stopTimer();S.paused=false;clearSave();S.round=0;S.scores=[0,0];S.hist=[];S.over=false;S.stopped=false;nextRound()}
function nextRound(){stopTimer();S.round++;S.size=S.round<=3?3:4;const d=deck();S.grid=d.splice(0,S.size*S.size);S.shared=d.splice(0,3);
  S.picks=[[],[]];S.locked=[false,false];S.hands=null;S.best=null;S.phase='ready';build();paint();saveGame()}
function countdown(){S.phase='count';timer(3,l=>{S.msg=String(Math.max(1,Math.ceil(l)));paint()},startMemo)}
function startMemo(){S.phase='memo';const sec=S.size===3?C.m3:C.m4;timer(sec,l=>{S.msg=Math.ceil(l);bars(l/sec);paint()},startPick)}
function startPick(){S.phase='pick';S.msg='';bars(0);paint();
  if(C.pt>0)timer(C.pt,l=>{S.msg=Math.ceil(l);bars(l/C.pt);paint()},autoLock)}
function autoLock(){[0,1].forEach(p=>{if(S.locked[p])return;const a=S.picks[p];while(a.length<2){const i=Math.floor(Math.random()*S.grid.length);if(!a.includes(i))a.push(i)}S.locked[p]=true});reveal()}
function choose(p,i){if(S.phase!=='pick'||S.locked[p])return;const a=S.picks[p],ix=a.indexOf(i);
  if(ix>=0)a.splice(ix,1);else{if(a.length>=2)a.shift();a.push(i)}try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}paint()}
function lock(p){if(S.phase!=='pick')return;if(S.locked[p]){S.locked[p]=false;paint();return}if(S.picks[p].length<2)return;S.locked[p]=true;paint();
  if(S.locked[0]&&S.locked[1])setTimeout(()=>{if(S.phase==='pick'&&S.locked[0]&&S.locked[1])reveal()},450)}
function reveal(){stopTimer();S.phase='reveal';
  S.hands=[0,1].map(p=>evalHand([...S.picks[p].map(i=>S.grid[i]),...S.shared]));S.best=bestPair();
  const c=cmp(S.hands[0],S.hands[1]);
  S.gain=C.mode==='each'?S.hands.map(h=>C.pts[h.k]):[c>0?C.pts[S.hands[0].k]:0,c<0?C.pts[S.hands[1].k]:0];
  S.scores=S.scores.map((s,p)=>s+S.gain[p]);
  S.hist.push({r:S.round,size:S.size,k:S.hands.map(h=>h.k),c:S.picks.map(a=>a.map(i=>nm(S.grid[i])).join(' ')),g:[...S.gain],w:c});
  S.over=Math.abs(S.scores[0]-S.scores[1])>=C.target;paint();saveGame();
  if(S.over)setTimeout(()=>{if(S.over&&S.phase==='reveal'&&!S.paused)showOver()},2200)}
const hName=(r,p)=>r.k?`${L.HN[r.k[p]]} (${r.c[p]})`:(r.h?r.h[p]:'');
function showOver(stopped){S.stopped=!!stopped;const d=S.scores[0]-S.scores[1],w=d>0?0:1,who=`<span style="color:var(--${w?'p2':'p1'})">${esc(dn(w))}</span>`;
  $('#winT').innerHTML=stopped?(d===0?L.tieStop:L.leadStop(who)):L.win(who);
  $('#finT').textContent=L.fin(S.scores[0],S.scores[1],S.round);
  $('#h0').textContent=dn(0);$('#h1').textContent=dn(1);
  $('#histB').innerHTML=S.hist.map(r=>`<tr><td>${r.r}</td><td>${r.size}×${r.size}</td><td>${r.w>0?'● ':''}${esc(hName(r,0))}</td><td class="n">+${r.g[0]}</td><td>${r.w<0?'● ':''}${esc(hName(r,1))}</td><td class="n">+${r.g[1]}</td></tr>`).join('');
  $('#over').classList.add('on')}

const num=(id,d,lo,hi)=>{const v=parseInt($(id).value,10);return isNaN(v)?d:Math.max(lo,Math.min(hi,v))};
function updResume(){const sv=getSave();$('#resumeBox').classList.toggle('hide',!sv);$('#newBtn').textContent=sv?L.startNew:L.start;
  if(sv){const t=new Date(sv.at);$('#resumeT').textContent=L.resumeT(sv.done?sv.round+1:sv.round,sv.scores[0],sv.scores[1],t.toLocaleString(L.loc,{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}))}}
function setNote(){$('#mNote').textContent=['memo','pick','count'].includes(S.phase)?L.noteMid:L.noteOut}
function applyLang(){L=I18N[C.lang];document.documentElement.lang=C.lang;document.title=L.doc;
  document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=L[el.dataset.t]});
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',L[el.dataset.ta]));
  $('#rules').innerHTML=L.rules(num('#target',C.target,1,200));
  $('#n0').placeholder=L.p[0];$('#n1').placeholder=L.p[1];
  document.querySelectorAll('#pts span').forEach((el,k)=>el.textContent=L.HN[k]);
  document.querySelectorAll('input[name=lang]').forEach(r=>r.checked=r.value===C.lang);
  document.querySelectorAll('.card').forEach(b=>b.setAttribute('aria-label',ariaOf(+b.dataset.i)));
  updResume();setNote();paint();
  P.forEach((pn,p)=>{if(pn.classList.contains('gd'))renderGuide(p)});
  if($('#over').classList.contains('on'))showOver(S.stopped)}
function fillSetup(){$('#n0').value=C.n[0];$('#n1').value=C.n[1];$('#target').value=C.target;$('#m3').value=C.m3;$('#m4').value=C.m4;$('#pt').value=C.pt;
  document.querySelector(`input[name=layout][value=${C.layout}]`).checked=true;document.querySelector(`input[name=mode][value=${C.mode}]`).checked=true;
  $('#pts').innerHTML=C.pts.map((v,k)=>`<label><span></span><input type="number" min="0" max="99" data-k="${k}" value="${v}"></label>`).join('');
  applyLang()}
function readSetup(){
  C.n=['#n0','#n1'].map(id=>{const v=$(id).value.trim();return isDefName(v)?'':v});
  C.layout=document.querySelector('input[name=layout]:checked').value;C.mode=document.querySelector('input[name=mode]:checked').value;
  C.target=num('#target',20,1,200);C.m3=num('#m3',10,2,120);C.m4=num('#m4',20,2,120);C.pt=num('#pt',0,0,120);
  C.pts=[...document.querySelectorAll('#pts input')].map((el,k)=>{const v=parseInt(el.value,10);return isNaN(v)?DEF.pts[k]:Math.max(0,Math.min(99,v))});
  save();$('#start').classList.remove('on')}
$('#setup').addEventListener('submit',e=>{e.preventDefault();readSetup();startGame()});
$('#resume').addEventListener('click',()=>{const sv=getSave();if(!sv)return;readSetup();resumeGame(sv)});
$('#delSave').addEventListener('click',()=>{clearSave();updResume()});
$('#target').addEventListener('input',()=>$('#rules').innerHTML=L.rules($('#target').value||'20'));
document.querySelectorAll('input[name=lang]').forEach(r=>r.addEventListener('change',()=>{C.lang=r.value;save();applyLang()}));

function renderGuide(p){const me=S.phase==='reveal'&&S.hands?S.hands[p].k:-1;
  P[p].querySelector('.guide').innerHTML=`<div class="gh"><h3>${L.gTitle}</h3><button type="button" class="btn gx">${L.close}</button></div><div class="gl">`+
  L.HN.map((h,k)=>({h,k})).reverse().map(({h,k})=>`<div class="gr${k===me?' me':''}"><div><b>${h}</b><small>${L.GX[k]}</small></div><span class="ex">${GXC[k].split(' ').map(c=>`<i class="${/[♥♦]/.test(c)?'rd':''}">${c}</i>`).join('')}</span><span class="gp">${L.pts(C.pts[k])}</span></div>`).join('')+
  `</div><p class="gn">${L.gNote}${C.mode==='each'?L.gEach:L.gWin}</p>`}
P.forEach((pn,p)=>{
  pn.querySelector('.rk').addEventListener('click',()=>{renderGuide(p);pn.classList.add('gd')});
  pn.querySelector('.guide').addEventListener('click',()=>pn.classList.remove('gd'));
  pn.querySelector('.bd').addEventListener('pointerdown',e=>{const b=e.target.closest('.card');if(b){e.preventDefault();choose(p,+b.dataset.i)}});
  pn.querySelector('.bd').addEventListener('keydown',e=>{const b=e.target.closest('.card');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();choose(p,+b.dataset.i)}});
  pn.querySelector('.ok').addEventListener('click',()=>lock(p));
  pn.querySelector('.rs').addEventListener('click',()=>{if(S.phase==='pick'&&!S.locked[p]){S.picks[p]=[];paint()}});
});
$('#act').addEventListener('click',()=>{if(S.phase==='ready')countdown();else if(S.phase==='reveal'){if(S.over)showOver();else nextRound()}});
const menu=$('#menu');
function openMenu(){if(!S.round)return;pause();setNote();menu.classList.add('on')}
function closeMenu(){menu.classList.remove('on');resume()}
$('#menuBtn').addEventListener('click',openMenu);
$('#mClose').addEventListener('click',closeMenu);
$('#mSave').addEventListener('click',()=>{saveGame();menu.classList.remove('on');stopTimer();S.paused=false;S.phase='idle';S.round=0;fillSetup();$('#start').classList.add('on')});
$('#mEnd').addEventListener('click',()=>{menu.classList.remove('on');stopTimer();S.paused=false;clearSave();S.over=true;paint();showOver(true)});
$('#mLayout').addEventListener('click',()=>{C.layout=C.layout==='side'?'face':'side';save();closeMenu();fitAll()});
$('#mLang').addEventListener('click',()=>{C.lang=C.lang==='ko'?'en':'ko';save();applyLang()});
$('#mFull').addEventListener('click',()=>{try{const d=document.documentElement,r=document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d);r&&r.catch&&r.catch(()=>{})}catch(e){}closeMenu()});
$('#mRestart').addEventListener('click',()=>{menu.classList.remove('on');startGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['count','memo','pick'].includes(S.phase)&&!S.paused)openMenu()});
$('#again').addEventListener('click',()=>{$('#over').classList.remove('on');startGame()});
$('#toSetup').addEventListener('click',()=>{$('#over').classList.remove('on');fillSetup();$('#start').classList.add('on')});

try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
const d0=deck();S.grid=d0.slice(0,9);S.shared=d0.slice(9,12);build();fillSetup();
}
</script>
</body>
</html>
